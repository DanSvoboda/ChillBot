services:
  flask:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      MCP_VARIETY_URL: http://variety-classifier:8000/mcp
      MCP_PLANT_HEALTH_URL: http://plant-health:8000/mcp
      KNOWLEDGE_PATH: /app/data/knowledge
      VECTOR_STORE_PATH: /app/data/vector_store
    volumes:
      - ./data/knowledge:/app/data/knowledge:ro
      - ./data/vector_store:/app/data/vector_store
    depends_on:
      - variety-classifier
      - plant-health

  variety-classifier:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: ["python", "mcp_servers/variety_classifier/server.py"]
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MODEL_DIR: /app/models/varieties
    expose:
      - "8000"
    volumes:
      - ./models/varieties:/app/models/varieties:ro

  plant-health:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: ["python", "mcp_servers/plant_health/server.py"]
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MODEL_DIR: /app/models/plant_health
    expose:
      - "8000"
    volumes:
      - ./models/plant_health:/app/models/plant_health:ro
