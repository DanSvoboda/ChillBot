services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "5000"
      KNOWLEDGE_PATH: /app/data/knowledge
      VECTOR_STORE_PATH: /app/data/vector_store
      MCP_VARIETY_URL: http://variety-classifier:8000/mcp
      MCP_PRODUCTION_URL: http://production-classifier:8000/mcp
      PRODUCTION_MODEL_PATH: /app/models/production_clf.pkl
    volumes:
      - ./data/knowledge:/app/data/knowledge:ro
      - vector_store:/app/data/vector_store
      - ./models/production_clf.pkl:/app/models/production_clf.pkl:ro
    depends_on:
      variety-classifier:
        condition: service_healthy
      production-classifier:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 5

  variety-classifier:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: ["python", "-m", "mcp_servers.variety_classifier.server"]
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      MCP_VARIETY_URL: http://variety-classifier:8000/mcp
      MCP_VARIETY_LOCAL_HOST: 0.0.0.0
      MCP_VARIETY_LOCAL_PORT: "8000"
      VARIETY_MODEL_PATH: /app/models/varieties/checkpoint.pt
    expose:
      - "8000"
    volumes:
      - variety_models:/app/models/varieties
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"
      interval: 15s
      timeout: 5s
      retries: 5

  production-classifier:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: ["python", "-m", "mcp_servers.production_classifier.server"]
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      MCP_PRODUCTION_URL: http://production-classifier:8000/mcp
      MCP_PRODUCTION_LOCAL_HOST: 0.0.0.0
      MCP_PRODUCTION_LOCAL_PORT: "8000"
      PRODUCTION_MODEL_PATH: /app/models/production_clf.pkl
    expose:
      - "8000"
    volumes:
      - ./models/production_clf.pkl:/app/models/production_clf.pkl:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  vector_store:
  variety_models:
