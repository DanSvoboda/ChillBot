[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chillbot"
version = "0.1.0"
description = "AI chatbot about chilli peppers with RAG and MCP model servers"
requires-python = ">=3.11"
dependencies = [
	"chromadb==1.5.9",
	"Flask==3.1.3",
	"gunicorn==23.0.0; sys_platform != 'win32'",
	"openai==3.28.0",
	"python-dotenv==1.2.4",
	"langchain-community==0.4.2",
	"langchain-text-splitters==1.1.3",
	"pypdf==6.20.0",
	"mcp==2.3.0",
	pytorch,
	torchvision,
	
]

[tool.setuptools]
packages = []
