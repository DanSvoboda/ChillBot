[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chillbot"
version = "0.1.0"
description = "AI chatbot about chilli peppers with RAG and ML model tools"
requires-python = ">=3.11"
dependencies = [
	"chromadb==1.5.9",
	"Flask==3.1.3",
	"gunicorn==23.0.0; sys_platform != 'win32'",
	"openai==3.28.0",
	"python-dotenv==1.2.4",
	"langchain-community==0.4.2",
	"langchain-text-splitters==1.1.3",
	"pypdf==6.20.0",
	"numpy==2.5.4",
	"pandas==3.1.1",
	"torch==2.14.1",
	"torchvision==0.29.1",
	"Pillow==12.3.0",
	"huggingface-hub==2.4.0",
	"scikit-learn==1.9.1",
	"joblib==1.6.0",
	"pydantic==2.14.0",
]

[tool.setuptools]
packages = []
